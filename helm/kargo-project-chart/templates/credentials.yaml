{{- /*
Kargo looks for a project's credentials in the PROJECT's namespace, not in the
control-plane namespace, and finds them by the kargo.akuity.io/cred-type label.
Every project needs the same three, so they are rendered here rather than
copied into each service repo.

Each Secret is an ExternalSecret: the chart never carries a credential, only
the reference to where the cluster keeps one.

repoURL is compared for EQUALITY unless repoURLIsRegex is true. A prefix with
the flag off silently matches nothing and the request goes out
unauthenticated, which reads as "no tags found" rather than as an auth error.
*/ -}}
{{- range $name, $cred := .Values.credentials }}
{{- if $cred.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-{{ $name }}-credentials
  namespace: {{ include "kargo-project-chart.namespace" $ }}
spec:
  refreshInterval: {{ $cred.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $cred.secretStore.kind | default "ClusterSecretStore" }}
    name: {{ required (printf "credentials.%s.secretStore.name is required" $name) $cred.secretStore.name }}
  target:
    name: kargo-{{ $name }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: {{ required (printf "credentials.%s.type is required" $name) $cred.type }}
      data:
        repoURL: {{ required (printf "credentials.%s.repoURL is required" $name) $cred.repoURL | quote }}
        repoURLIsRegex: {{ $cred.repoURLIsRegex | default false | quote }}
        {{- range $k, $v := $cred.data }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
  {{- with $cred.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cred.remoteKeys }}
  data:
    {{- range $secretKey, $remoteKey := . }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
