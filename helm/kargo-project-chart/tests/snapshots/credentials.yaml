---
# Source: kargo-project-chart/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: widget
  labels:
    kargo.akuity.io/project: "true"
    fomiller.dev/ecr-pull: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

---
# Source: kargo-project-chart/templates/credentials.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ecr-image-credentials
  namespace: widget
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ecr-token-clustersecretstore
  target:
    name: kargo-ecr-image-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: "^695434033664\\.dkr\\.ecr\\.us-east-1\\.amazonaws\\.com/.*$"
        repoURLIsRegex: "true"
        password: "{{ .password }}"
        username: "{{ .username }}"
  dataFrom:
    - extract:
        key: ecr-token

---
# Source: kargo-project-chart/templates/credentials.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-credentials
  namespace: widget
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-kargo-clustersecretstore
  target:
    name: kargo-git-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: "^https://git\\.example\\.com/widget/.*$"
        repoURLIsRegex: "true"
        githubAppID: "{{ .KARGO_BOT_APP_ID }}"
        githubAppInstallationID: "{{ .KARGO_BOT_INSTALLATION_ID }}"
        githubAppPrivateKey: "{{ .KARGO_BOT_PRIVATE_KEY }}"
  data:
    - secretKey: KARGO_BOT_APP_ID
      remoteRef:
        key: KARGO_BOT_APP_ID
    - secretKey: KARGO_BOT_INSTALLATION_ID
      remoteRef:
        key: KARGO_BOT_INSTALLATION_ID
    - secretKey: KARGO_BOT_PRIVATE_KEY
      remoteRef:
        key: KARGO_BOT_PRIVATE_KEY

---
# Source: kargo-project-chart/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: widget

---
# Source: kargo-project-chart/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: widget
  namespace: widget
spec:
  promotionPolicies:

---
# Source: kargo-project-chart/templates/stages.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: widget
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: image_widget_api
          value: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/Fomiller/homelab.git
            checkout:
              - branch: main
                path: ./repo
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: promote ${{ ctx.targetFreight.name }} to prod
        - uses: git-push
          config:
            path: ./repo

---
# Source: kargo-project-chart/templates/warehouses.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: widget
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: false
