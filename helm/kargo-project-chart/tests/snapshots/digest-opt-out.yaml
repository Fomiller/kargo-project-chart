---
# Source: kargo-project-chart/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: widget
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

---
# Source: kargo-project-chart/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: widget

---
# Source: kargo-project-chart/templates/project.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: widget
  namespace: widget
spec:
  promotionPolicies:

---
# Source: kargo-project-chart/templates/stages.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: pinned
  namespace: widget
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: image_widget_api
          value: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/Fomiller/homelab.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          if: ${{ ctx.targetFreight.origin.name == 'app' }}
          config:
            path: ./repo/k8s/apps/widget/overlays/pinned/values.yaml
            updates:
              - key: image.digest
                value: ${{ imageFrom(vars.image_widget_api, warehouse('app')).Tag + '@' + imageFrom(vars.image_widget_api, warehouse('app')).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: promote ${{ ctx.targetFreight.name }} to pinned
        - uses: git-push
          config:
            path: ./repo

---
# Source: kargo-project-chart/templates/stages.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: bare
  namespace: widget
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: image_widget_api
          value: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/Fomiller/homelab.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          if: ${{ ctx.targetFreight.origin.name == 'app' }}
          config:
            path: ./repo/k8s/apps/widget/overlays/bare/values.yaml
            updates:
              - key: image.digest
                value: ${{ imageFrom(vars.image_widget_api, warehouse('app')).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: promote ${{ ctx.targetFreight.name }} to bare
        - uses: git-push
          config:
            path: ./repo

---
# Source: kargo-project-chart/templates/warehouses.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: widget
spec:
  freightCreationPolicy: Automatic
  interval: 5m0s
  subscriptions:
    - image:
        repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: false
