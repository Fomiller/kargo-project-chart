  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true

---
# Source: kargo-project-chart/templates/stages.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: gadget
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: app
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: image_gadget_api
          value: 695434033664.dkr.ecr.us-east-1.amazonaws.com/gadget-api
        - name: chart_kargo_project_chart
          value: oci://695434033664.dkr.ecr.us-east-1.amazonaws.com/kargo-project-chart
        - name: git_flake_hub
          value: https://github.com/Fomiller/flake-hub.git
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/Fomiller/homelab.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          if: ${{ ctx.targetFreight.origin.name == 'app' }}
          config:
            path: ./repo/k8s/apps/gadget/overlays/dev/values.yaml
            updates:
              - key: image.digest
                value: ${{ imageFrom(vars.image_gadget_api, warehouse('app')).Tag + '@' + imageFrom(vars.image_gadget_api, warehouse('app')).Digest }}
              - key: charts.kargoProject.version
                value: ${{ chartFrom(vars.chart_kargo_project_chart, warehouse('app')).Version }}
        - uses: yaml-update
          if: ${{ ctx.targetFreight.origin.name == 'app' }}
          config:
            path: ./repo/versions/dev/pins.yaml
            updates:
              - key: flakeHub.tag
                value: ${{ commitFrom(vars.git_flake_hub, warehouse('app')).Tag }}
              - key: flakeHub.sha
                value: ${{ commitFrom(vars.git_flake_hub, warehouse('app')).ID }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: promote ${{ ctx.targetFreight.name }} to dev
        - uses: git-push
          config:
            path: ./repo

