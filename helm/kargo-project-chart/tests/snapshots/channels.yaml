# Source: kargo-project-chart/templates/credentials.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ecr-chart-credentials
  namespace: gadget
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ecr-token-clustersecretstore
  target:
    name: kargo-ecr-chart-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: helm
      data:
        repoURL: "^oci://695434033664\\.dkr\\.ecr\\.us-east-1\\.amazonaws\\.com/.*$"
        repoURLIsRegex: "true"
        password: "{{ .password }}"
        username: "{{ .username }}"
  dataFrom:
    - extract:
        key: ecr-token

