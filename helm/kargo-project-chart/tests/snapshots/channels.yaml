# Source: kargo-project-chart/templates/warehouses.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: gadget
spec:
  freightCreationPolicy: Automatic
  interval: 2m0s
  subscriptions:
    - image:
        repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/gadget-api
        imageSelectionStrategy: SemVer
        discoveryLimit: 50
        strictSemvers: true
        allowTagsRegexes:
          - "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    - chart:
        repoURL: oci://695434033664.dkr.ecr.us-east-1.amazonaws.com/kargo-project-chart
        semverConstraint: ">=0.0.0"
        discoveryLimit: 50
    - git:
        repoURL: https://github.com/Fomiller/flake-hub.git
        commitSelectionStrategy: NewestTag
        allowTagsRegexes:
          - "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
        discoveryLimit: 50

