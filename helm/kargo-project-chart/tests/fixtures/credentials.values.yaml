# Every credential shape at once: a git one naming its remote keys, a registry
# one pulling a whole entry, and a disabled one that must render nothing.
#
# The three cred-types are separate on purpose. Kargo looks each one up
# independently, so an image credential does not authenticate a chart
# subscription against the same registry.
project:
  name: widget
  repoURL: https://github.com/Fomiller/homelab.git
  namespaceLabels:
    fomiller.dev/ecr-pull: "true"

credentials:
  git:
    enabled: true
    type: git
    secretStore:
      name: doppler-kargo-clustersecretstore
    repoURL: '^https://github\.com/Fomiller/.*$'
    repoURLIsRegex: true
    data:
      githubAppID: "{{ .KARGO_BOT_APP_ID }}"
      githubAppInstallationID: "{{ .KARGO_BOT_INSTALLATION_ID }}"
      githubAppPrivateKey: "{{ .KARGO_BOT_PRIVATE_KEY }}"
    remoteKeys:
      KARGO_BOT_APP_ID: KARGO_BOT_APP_ID
      KARGO_BOT_INSTALLATION_ID: KARGO_BOT_INSTALLATION_ID
      KARGO_BOT_PRIVATE_KEY: KARGO_BOT_PRIVATE_KEY
  ecr-image:
    enabled: true
    type: image
    refreshInterval: 30m
    secretStore:
      name: ecr-token-clustersecretstore
    repoURL: '^695434033664\.dkr\.ecr\.us-east-1\.amazonaws\.com/.*$'
    repoURLIsRegex: true
    data:
      username: "{{ .username }}"
      password: "{{ .password }}"
    dataFrom:
      - extract:
          key: ecr-token
  ecr-chart:
    enabled: false
    type: helm
    secretStore:
      name: ecr-token-clustersecretstore
    repoURL: '^oci://695434033664\.dkr\.ecr\.us-east-1\.amazonaws\.com/.*$'
    repoURLIsRegex: true

services:
  - name: widget-api
    image:
      repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api

warehouses:
  - name: app
    services: [widget-api]

stages:
  - name: prod
    warehouses: [app]
    env: prod
    git: { branch: main }
