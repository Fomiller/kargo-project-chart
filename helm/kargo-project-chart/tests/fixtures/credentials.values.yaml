# What a project actually writes about credentials: nothing, or an override.
#
# The three cluster credentials come from the chart's own values, so the
# baseline snapshot is what proves the defaults render. This fixture proves the
# two things a project can still do: drop one it does not need, and point one
# somewhere else.
project:
  name: widget
  repoURL: https://github.com/Fomiller/homelab.git

credentials:
  # No chart subscription here, so no helm credential.
  ecr-chart:
    enabled: false
  # A project whose git lives somewhere the cluster default does not match.
  git:
    repoURL: '^https://git\.example\.com/widget/.*$'

services:
  - name: widget-api
    image:
      repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com/widget-api

warehouses:
  - name: app
    services: [widget-api]

stages:
  - name: prod
    warehouses: [app]
    env: prod
    git: { branch: main }
