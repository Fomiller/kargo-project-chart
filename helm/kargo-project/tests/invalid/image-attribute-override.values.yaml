project: { name: bad, repoURL: https://github.com/Fomiller/homelab.git }
services:
  - name: svc
    image: { repoURL: example.com/svc }
warehouses:
  - name: app
    services: all
    updatePaths:
      - path: values.yaml
        updates:
          - { key: image.tag, source: svc, attribute: Tag }
stages:
  - name: dev
    warehouses: [app]
    overlayPath: overlays/dev
    git: { branch: main }
