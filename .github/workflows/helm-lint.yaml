name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/helm-lint.yaml'
      - 'helm/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/helm-lint.yaml'
      - 'helm/**'
      - 'scripts/**'

jobs:
  version-script:
    name: Version script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/tests/next-version.test.sh

  lint:
    name: Lint and snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # `helm lint` with the shipped values only proves the chart parses — every
      # list in values.yaml is empty by design. Linting each fixture is what
      # actually exercises the templates.
      - name: helm lint
        run: |
          for fixture in helm/kargo-project/tests/fixtures/*.values.yaml; do
            echo "::group::lint $(basename "$fixture")"
            helm lint helm/kargo-project --values "$fixture"
            echo "::endgroup::"
          done

      # Fails when a template change moves a warehouse name, an origin guard, or
      # the order of the promotion steps without the snapshot being updated.
      - name: Snapshot tests
        run: helm/kargo-project/tests/run.sh
